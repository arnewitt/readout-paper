<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>readout-paper</title>
<style>
  :root {
    --bg: #eef0f2;
    --surface: #ffffff;
    --text: #14181b;
    --muted: #6d757b;
    --line: #d9dee2;
    --line-strong: #c2c9cf;
    --signal: #0a7268;
    --signal-dim: #b9cfcb;
    --danger: #a12f24;
    color-scheme: light;
    --mono: ui-monospace, "SF Mono", "SFMono-Regular", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #0f1214;
      --surface: #171c1f;
      --text: #e6eaec;
      --muted: #8b9399;
      --line: #262d31;
      --line-strong: #39434a;
      --signal: #3dd9c4;
      --signal-dim: #2c4a49;
      --danger: #f08b7d;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  main {
    max-width: 44rem;
    margin: 0 auto;
    padding: 3rem 1.25rem 4rem;
  }

  /* --- header ------------------------------------------------------- */
  header { margin-bottom: 2rem; }
  h1 {
    font-family: var(--mono);
    font-size: 1.25rem;
    font-weight: 500;
    letter-spacing: -0.02em;
    margin: 0;
  }
  h1 .sep { color: var(--muted); }
  .subtitle {
    font-family: var(--mono);
    font-size: 0.75rem;
    color: var(--muted);
    margin: 0.4rem 0 0;
  }

  /* --- card --------------------------------------------------------- */
  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 4px;
  }
  .card + .card { margin-top: 1rem; }
  .pad { padding: 1.25rem; }
  .row {
    display: flex;
    gap: 1.5rem;
    align-items: flex-end;
    flex-wrap: wrap;
    border-top: 1px solid var(--line);
    padding: 1rem 1.25rem;
  }
  .field { flex: 1 1 12rem; min-width: 0; }

  label, .label {
    display: block;
    font-family: var(--mono);
    font-size: 0.6875rem;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 0.5rem;
  }

  textarea {
    width: 100%;
    min-height: 11rem;
    resize: vertical;
    border: 0;
    padding: 0;
    background: transparent;
    color: inherit;
    font-family: var(--sans);
    font-size: 1rem;
    line-height: 1.6;
  }
  textarea::placeholder { color: var(--muted); }

  .count {
    font-family: var(--mono);
    font-size: 0.6875rem;
    color: var(--muted);
    text-align: right;
    margin-top: 0.75rem;
  }

  select {
    width: 100%;
    font-family: var(--mono);
    font-size: 0.8125rem;
    color: inherit;
    background: transparent;
    border: 1px solid var(--line-strong);
    border-radius: 3px;
    padding: 0.45rem 0.5rem;
  }

  input[type="range"] {
    width: 100%;
    accent-color: var(--signal);
    margin: 0.55rem 0 0;
  }
  .speed-head { display: flex; justify-content: space-between; align-items: baseline; }
  .speed-head .label { margin-bottom: 0; }
  .speed-head .value { font-family: var(--mono); font-size: 0.6875rem; color: var(--text); }

  button {
    font-family: var(--mono);
    font-size: 0.8125rem;
    letter-spacing: 0.02em;
    color: var(--surface);
    background: var(--text);
    border: 1px solid var(--text);
    border-radius: 3px;
    padding: 0.55rem 1.1rem;
    cursor: pointer;
  }
  button:hover:not(:disabled) { background: var(--signal); border-color: var(--signal); }
  button:disabled { opacity: 0.45; cursor: default; }
  .submit-row {
    display: flex;
    align-items: center;
    gap: 0.9rem;
    flex-wrap: wrap;
  }
  .status {
    font-family: var(--mono);
    font-size: 0.6875rem;
    color: var(--muted);
  }
  .status.error { color: var(--danger); }

  :focus-visible {
    outline: 2px solid var(--signal);
    outline-offset: 2px;
  }

  /* --- player ------------------------------------------------------- */
  #player[hidden] { display: none; }
  canvas {
    display: block;
    width: 100%;
    height: 88px;
    cursor: pointer;
    touch-action: none;
  }
  .transport {
    display: flex;
    align-items: center;
    gap: 0.9rem;
    border-top: 1px solid var(--line);
    padding: 0.7rem 1.25rem;
  }
  .transport button {
    width: 2.1rem;
    height: 2.1rem;
    padding: 0;
    display: grid;
    place-items: center;
    border-radius: 50%;
    flex: none;
  }
  .time {
    font-family: var(--mono);
    font-size: 0.75rem;
    font-variant-numeric: tabular-nums;
    color: var(--muted);
  }
  .time b { color: var(--text); font-weight: 500; }
  .transport a {
    margin-left: auto;
    font-family: var(--mono);
    font-size: 0.75rem;
    color: var(--muted);
    text-decoration: none;
    border-bottom: 1px solid var(--line-strong);
    padding-bottom: 1px;
  }
  .transport a:hover { color: var(--signal); border-color: var(--signal); }
</style>
</head>
<body>
<main>
  <header>
    <h1>readout<span class="sep">-</span>paper</h1>
    <p class="subtitle">Kokoro-82M &middot; running on this machine &middot; nothing leaves it</p>
  </header>

  <form id="form">
    <div class="card">
      <div class="pad editor">
        <label for="text">Text</label>
        <textarea id="text" name="text" placeholder="Paste the paper, or any text you want read aloud." autofocus></textarea>
        <div class="count"><span id="count">0</span> characters</div>
      </div>

      <div class="row">
        <div class="field">
          <label for="voice">Voice</label>
          <select id="voice" name="voice"></select>
        </div>
        <div class="field">
          <div class="speed-head">
            <span class="label" id="speed-label">Speed</span>
            <span class="value" id="speed-value">1.00&times;</span>
          </div>
          <input type="range" id="speed" name="speed" min="0.5" max="2" step="0.05" value="1"
                 aria-labelledby="speed-label" aria-valuetext="1.00 times">
        </div>
      </div>

      <div class="row submit-row">
        <button type="submit" id="submit">Read it aloud</button>
        <span class="status" id="status" role="status"></span>
      </div>
    </div>
  </form>

  <div class="card" id="player" hidden>
    <canvas id="wave" role="slider" tabindex="0" aria-label="Seek"
            aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></canvas>
    <div class="transport">
      <button type="button" id="play" aria-label="Play">
        <svg id="play-icon" width="11" height="12" viewBox="0 0 11 12" fill="currentColor" aria-hidden="true">
          <path d="M0 0l11 6-11 6z"/>
        </svg>
        <svg id="pause-icon" width="10" height="12" viewBox="0 0 10 12" fill="currentColor" aria-hidden="true" hidden>
          <path d="M0 0h3v12H0zM7 0h3v12H7z"/>
        </svg>
      </button>
      <span class="time"><b id="at">0:00</b> / <span id="dur">0:00</span></span>
      <a id="download" download="readout.wav">Download WAV</a>
    </div>
  </div>
</main>

<audio id="audio" preload="auto"></audio>

<script>
const VOICES = __VOICES__;
const DEFAULT_VOICE = __DEFAULT_VOICE__;

const $ = (id) => document.getElementById(id);
const form = $("form"), textEl = $("text"), voiceEl = $("voice"), speedEl = $("speed");
const submitEl = $("submit"), statusEl = $("status"), playerEl = $("player");
const audio = $("audio"), canvas = $("wave"), ctx = canvas.getContext("2d");

/* --- voice picker, grouped by language ------------------------------ */
for (const group of VOICES) {
  const og = document.createElement("optgroup");
  og.label = group.name;
  for (const voice of group.voices) {
    const opt = new Option(voice, voice, false, voice === DEFAULT_VOICE);
    og.append(opt);
  }
  voiceEl.append(og);
}

/* --- small live bits ------------------------------------------------ */
textEl.addEventListener("input", () => {
  $("count").textContent = textEl.value.length.toLocaleString();
});
speedEl.addEventListener("input", () => {
  const v = Number(speedEl.value).toFixed(2);
  $("speed-value").innerHTML = v + "&times;";
  speedEl.setAttribute("aria-valuetext", v + " times");
});
textEl.addEventListener("keydown", (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === "Enter") form.requestSubmit();
});

/* --- synthesis ------------------------------------------------------ */
let objectUrl = null;
let firstRun = true;

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = textEl.value.trim();
  if (!text) {
    setStatus("Nothing to read yet — add some text above.", true);
    textEl.focus();
    return;
  }

  submitEl.disabled = true;
  submitEl.textContent = "Reading…";
  setStatus(firstRun ? "Loading the model. The first run takes a minute." : "Synthesizing…");

  try {
    const res = await fetch("/synth", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text, voice: voiceEl.value, speed: Number(speedEl.value) }),
    });
    if (!res.ok) {
      const info = await res.json().catch(() => ({ error: "Synthesis failed." }));
      throw new Error(info.error || "Synthesis failed.");
    }

    const buf = await res.arrayBuffer();
    const blob = new Blob([buf.slice(0)], { type: "audio/wav" });

    if (objectUrl) URL.revokeObjectURL(objectUrl);
    objectUrl = URL.createObjectURL(blob);
    audio.src = objectUrl;
    $("download").href = objectUrl;

    playerEl.hidden = false;
    peaks = await decodePeaks(buf);
    resize();
    setStatus("");
    firstRun = false;
    audio.play().catch(() => {});
  } catch (err) {
    setStatus(err.message, true);
  } finally {
    submitEl.disabled = false;
    submitEl.textContent = "Read it aloud";
  }
});

function setStatus(msg, isError) {
  statusEl.textContent = msg;
  statusEl.classList.toggle("error", Boolean(isError));
}

/* --- waveform ------------------------------------------------------- */
const BAR = 3, GAP = 2;
let peaks = [];

async function decodePeaks(buf) {
  const AC = window.AudioContext || window.webkitAudioContext;
  try {
    const audioCtx = new AC();
    const decoded = await audioCtx.decodeAudioData(buf);
    audioCtx.close();
    const data = decoded.getChannelData(0);
    const bars = Math.max(1, Math.floor(canvas.clientWidth / (BAR + GAP)));
    const step = Math.floor(data.length / bars) || 1;
    const out = [];
    for (let i = 0; i < bars; i++) {
      let peak = 0;
      for (let j = i * step, end = Math.min(j + step, data.length); j < end; j++) {
        const v = Math.abs(data[j]);
        if (v > peak) peak = v;
      }
      out.push(peak);
    }
    const max = Math.max(...out, 0.01);
    return out.map((p) => p / max);
  } catch {
    return [];  // no waveform is survivable; the transport still works
  }
}

function css(name) {
  return getComputedStyle(document.body).getPropertyValue(name).trim();
}

function draw() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  ctx.clearRect(0, 0, w, h);
  if (!peaks.length) return;

  const progress = audio.duration ? audio.currentTime / audio.duration : 0;
  const played = progress * w;
  const mid = h / 2;

  const slot = w / peaks.length;
  const bw = Math.max(1, slot - GAP);
  for (let i = 0; i < peaks.length; i++) {
    const x = i * slot;
    const bh = Math.max(2, peaks[i] * (h - 16));
    ctx.fillStyle = x + bw <= played ? css("--signal") : css("--signal-dim");
    ctx.fillRect(x, mid - bh / 2, bw, bh);
  }

  ctx.fillStyle = css("--signal");
  ctx.fillRect(Math.min(played, w - 1), 0, 1, h);
}

function resize() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = canvas.clientWidth * dpr;
  canvas.height = canvas.clientHeight * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  draw();
}
window.addEventListener("resize", resize);

/* --- transport ------------------------------------------------------ */
const fmt = (s) => {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
};

$("play").addEventListener("click", () => {
  audio.paused ? audio.play() : audio.pause();
});

for (const [event, playing] of [["play", true], ["pause", false], ["ended", false]]) {
  audio.addEventListener(event, () => {
    $("play-icon").hidden = playing;
    $("pause-icon").hidden = !playing;
    $("play").setAttribute("aria-label", playing ? "Pause" : "Play");
    if (playing) tick();
  });
}

audio.addEventListener("loadedmetadata", () => {
  $("dur").textContent = fmt(audio.duration);
  draw();
});

function tick() {
  $("at").textContent = fmt(audio.currentTime);
  const pct = audio.duration ? (audio.currentTime / audio.duration) * 100 : 0;
  canvas.setAttribute("aria-valuenow", Math.round(pct));
  draw();
  if (!audio.paused) requestAnimationFrame(tick);
}
audio.addEventListener("timeupdate", () => { if (audio.paused) tick(); });

function seekTo(clientX) {
  if (!audio.duration) return;
  const rect = canvas.getBoundingClientRect();
  const ratio = Math.min(1, Math.max(0, (clientX - rect.left) / rect.width));
  audio.currentTime = ratio * audio.duration;
  tick();
}
canvas.addEventListener("pointerdown", (e) => {
  canvas.setPointerCapture(e.pointerId);
  seekTo(e.clientX);
});
canvas.addEventListener("pointermove", (e) => {
  if (canvas.hasPointerCapture(e.pointerId)) seekTo(e.clientX);
});
canvas.addEventListener("keydown", (e) => {
  const nudge = { ArrowLeft: -5, ArrowRight: 5, ArrowDown: -5, ArrowUp: 5 }[e.key];
  if (nudge === undefined) return;
  e.preventDefault();
  audio.currentTime = Math.min(audio.duration, Math.max(0, audio.currentTime + nudge));
  tick();
});

matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
</script>
</body>
</html>
